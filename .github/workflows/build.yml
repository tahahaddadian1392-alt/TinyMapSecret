name: Build TinyMap Secret

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Geode CLI
        uses: geode-sdk/cli@main

      - name: Install Android SDK binaries
        run: geode sdk install-binaries -p android64

      - name: Build mod
        run: geode build -p android64

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: TinyMapSecret-android64
          path: build-android64/*.geode
          if-no-files-found: error
